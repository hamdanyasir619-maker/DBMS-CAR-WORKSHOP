{% extends "base.html" %}
{% block title %}{{ action }} Mechanic{% endblock %}
{% block page_title %}{{ action }} Mechanic{% endblock %}

{% block content %}
<div class="card form-card">
    <div class="card-header">
        <h2><i class="fa-solid fa-user-gear"></i> {{ action }} Mechanic</h2>
        <a href="{{ url_for('mechanics') }}" class="btn btn-sm btn-outline">
            <i class="fa-solid fa-arrow-left"></i> Back
        </a>
    </div>
    <form method="POST" class="form-grid">
        <div class="form-group">
            <label for="first_name">First Name</label>
            <input type="text" id="first_name" name="first_name" required
                   value="{{ mechanic.FirstName if mechanic else '' }}" placeholder="e.g. Carlos">
        </div>
        <div class="form-group">
            <label for="last_name">Last Name</label>
            <input type="text" id="last_name" name="last_name" required
                   value="{{ mechanic.LastName if mechanic else '' }}" placeholder="e.g. Mendez">
        </div>
        <div class="form-group">
            <label for="skill_level">Skill Level</label>
            <select id="skill_level" name="skill_level" required>
                {% for level in ['Junior', 'Intermediate', 'Senior', 'Master'] %}
                <option value="{{ level }}"
                    {% if mechanic and mechanic.SkillLevel == level %}selected{% endif %}>
                    {{ level }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="contact">Contact</label>
            <input type="text" id="contact" name="contact" required
                   value="{{ mechanic.Contact if mechanic else '' }}" placeholder="+1 555 000 0000">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-floppy-disk"></i> {{ action }} Mechanic
            </button>
            <a href="{{ url_for('mechanics') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
