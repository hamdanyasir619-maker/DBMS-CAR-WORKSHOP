{% extends "base.html" %}
{% block title %}{{ action }} Service Job{% endblock %}
{% block page_title %}{{ action }} Service Job{% endblock %}

{% block content %}
<div class="card form-card">
    <div class="card-header">
        <h2><i class="fa-solid fa-clipboard-list"></i> {{ action }} Service Job</h2>
        <a href="{{ url_for('jobs') }}" class="btn btn-sm btn-outline">
            <i class="fa-solid fa-arrow-left"></i> Back
        </a>
    </div>
    <form method="POST" class="form-grid">
        <div class="form-group">
            <label for="date">Job Date</label>
            <input type="date" id="date" name="date" required
                   value="{{ job.Date if job else today }}">
        </div>
        <div class="form-group">
            <label for="status">Status</label>
            <select id="status" name="status" required>
                {% for s in ['Pending', 'In Progress', 'Completed', 'Cancelled'] %}
                <option value="{{ s }}"
                    {% if job and job.Status == s %}selected{% endif %}>{{ s }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="labor_cost">Labor Cost ($)</label>
            <input type="number" id="labor_cost" name="labor_cost" min="0" step="0.01" required
                   value="{{ job.LaborCost if job else '0.00' }}" placeholder="0.00">
        </div>
        <div class="form-group">
            <label for="vehicle_id">Vehicle</label>
            <select id="vehicle_id" name="vehicle_id" required>
                <option value="">-- Select Vehicle --</option>
                {% for v in vehicles %}
                <option value="{{ v.VehicleID }}"
                    {% if job and job.VehicleID == v.VehicleID %}selected{% endif %}>
                    {{ v.RegNo }} — {{ v.Make }} {{ v.ModelName }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="mechanic_id">Assign Mechanic</label>
            <select id="mechanic_id" name="mechanic_id" required>
                <option value="">-- Select Mechanic --</option>
                {% for m in mechanics %}
                <option value="{{ m.MechanicID }}"
                    {% if job and job.MechanicID == m.MechanicID %}selected{% endif %}>
                    {{ m.FirstName }} {{ m.LastName }} ({{ m.SkillLevel }})
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-floppy-disk"></i> {{ action }} Job
            </button>
            <a href="{{ url_for('jobs') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
