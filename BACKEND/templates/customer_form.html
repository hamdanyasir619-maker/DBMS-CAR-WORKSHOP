{% extends "base.html" %}
{% block title %}{{ action }} Customer{% endblock %}
{% block page_title %}{{ action }} Customer{% endblock %}

{% block content %}
<div class="card form-card">
    <div class="card-header">
        <h2><i class="fa-solid fa-user-plus"></i> {{ action }} Customer</h2>
        <a href="{{ url_for('customers') }}" class="btn btn-sm btn-outline">
            <i class="fa-solid fa-arrow-left"></i> Back
        </a>
    </div>
    <form method="POST" class="form-grid">
        <div class="form-group">
            <label for="first_name">First Name</label>
            <input type="text" id="first_name" name="first_name" required
                   value="{{ customer.FirstName if customer else '' }}" placeholder="e.g. John">
        </div>
        <div class="form-group">
            <label for="last_name">Last Name</label>
            <input type="text" id="last_name" name="last_name" required
                   value="{{ customer.LastName if customer else '' }}" placeholder="e.g. Smith">
        </div>
        <div class="form-group">
            <label for="phone">Phone</label>
            <input type="text" id="phone" name="phone" required
                   value="{{ customer.Phone if customer else '' }}" placeholder="+1 555 000 0000">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   value="{{ customer.Email if customer else '' }}" placeholder="john@example.com">
        </div>
        <div class="form-group">
            <label for="street">Street</label>
            <input type="text" id="street" name="street"
                   value="{{ customer.Street if customer else '' }}" placeholder="123 Main St">
        </div>
        <div class="form-group">
            <label for="city">City</label>
            <input type="text" id="city" name="city"
                   value="{{ customer.City if customer else '' }}" placeholder="Los Angeles">
        </div>
        <div class="form-group">
            <label for="state">State</label>
            <input type="text" id="state" name="state"
                   value="{{ customer.State if customer else '' }}" placeholder="CA">
        </div>
        <div class="form-group">
            <label for="zip_code">Zip Code</label>
            <input type="text" id="zip_code" name="zip_code"
                   value="{{ customer.ZipCode if customer else '' }}" placeholder="90001">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-floppy-disk"></i> {{ action }} Customer
            </button>
            <a href="{{ url_for('customers') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
