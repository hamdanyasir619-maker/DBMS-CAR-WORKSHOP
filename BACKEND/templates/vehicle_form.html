{% extends "base.html" %}
{% block title %}{{ action }} Vehicle{% endblock %}
{% block page_title %}{{ action }} Vehicle{% endblock %}

{% block content %}
<div class="card form-card">
    <div class="card-header">
        <h2><i class="fa-solid fa-car"></i> {{ action }} Vehicle</h2>
        <a href="{{ url_for('vehicles') }}" class="btn btn-sm btn-outline">
            <i class="fa-solid fa-arrow-left"></i> Back
        </a>
    </div>
    <form method="POST" class="form-grid">
        <div class="form-group">
            <label for="reg_no">Registration Number</label>
            <input type="text" id="reg_no" name="reg_no" required
                   value="{{ vehicle.RegNo if vehicle else '' }}" placeholder="e.g. ABC-1234">
        </div>
        <div class="form-group">
            <label for="make">Make</label>
            <input type="text" id="make" name="make" required
                   value="{{ vehicle.Make if vehicle else '' }}" placeholder="e.g. Toyota">
        </div>
        <div class="form-group">
            <label for="model_name">Model</label>
            <input type="text" id="model_name" name="model_name" required
                   value="{{ vehicle.ModelName if vehicle else '' }}" placeholder="e.g. Corolla">
        </div>
        <div class="form-group">
            <label for="year">Year</label>
            <input type="number" id="year" name="year" required min="1900" max="2100"
                   value="{{ vehicle.Year if vehicle else '' }}" placeholder="2022">
        </div>
        <div class="form-group form-group-full">
            <label for="customer_id">Owner (Customer)</label>
            <select id="customer_id" name="customer_id" required>
                <option value="">-- Select Customer --</option>
                {% for c in customers %}
                <option value="{{ c.CustomerID }}"
                    {% if vehicle and vehicle.CustomerID == c.CustomerID %}selected{% endif %}>
                    {{ c.FirstName }} {{ c.LastName }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-floppy-disk"></i> {{ action }} Vehicle
            </button>
            <a href="{{ url_for('vehicles') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
